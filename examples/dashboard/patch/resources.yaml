---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: "grafana"
spec:
  config:
    log:
      mode: "console"
    auth:
      disable_login_form: "false"
    security:
      admin_user: root
      admin_password: secret
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: grafanadashboard-patch
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  # Externally sourced, with its own tags that we can't modify in-line.
  grafanaCom:
    id: 1860
  # Patch scripts are jq expressions that evaluate against the resolved dashboard JSON.
  # They run in order, each seeing the output of the previous script.
  # This script amends the existing tags with an "override" tag.
  patch:
    scripts:
      - '.tags = ((.tags // []) + ["override"]) | .tags |= unique'
