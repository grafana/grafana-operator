apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaSilence
metadata:
  name: silence-sample
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  comment: "Silencing high CPU noise during scheduled database maintenance"
  createdBy: "DevOps Team"
  startsAt: "2026-01-01T00:00:00Z"
  endsAt: "2099-01-01T00:00:00Z"
  matchers:
    - name: alertname
      value: HighCPUUsage
      isEqual: true
      isRegex: false
    - name: env
      value: "prod|staging"
      isEqual: true
      isRegex: true
